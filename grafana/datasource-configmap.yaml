apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: http://influxdb.influxdb.svc.cluster.local:80
        isDefault: true
        jsonData:
          version: Flux
          organization: shields-farm
          defaultBucket: broodminder
          tlsSkipVerify: true
        secureJsonData:
          token: ${INFLUXDB_TOKEN}
